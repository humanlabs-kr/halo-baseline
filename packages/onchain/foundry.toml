[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Matches the deployed configuration exactly. The `@openzeppelin/` mapping is
# the one the production repo compiled with; `forge-std/` is the sole addition,
# needed only because the test suite lives in this checkout.
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]
# 0.8.22 is the compiler the live implementations were built with. Do not raise
# it: the contracts behind the mainnet UUPS proxies must stay reproducible.
solc = "0.8.22"
optimizer = true
optimizer_runs = 200
via_ir = true

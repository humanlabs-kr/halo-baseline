[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# 0.8.26 and Cancun, both required by Uniswap v4 — the singleton uses transient
# storage. This is deliberately NOT the 0.8.22 that `packages/onchain` pins:
# that package's implementations sit behind a live mainnet UUPS proxy and have
# to stay byte-reproducible, so raising its pragma is a broken upgrade rather
# than an upgrade. Two packages, two compilers, no shared profile.
solc = "0.8.26"
evm_version = "cancun"

optimizer = true
optimizer_runs = 800
via_ir = false

# v4 hook addresses encode their permissions in the low bits, so the deploy
# script mines a CREATE2 salt. Tests do the same through HookMiner, which needs
# to deploy to an arbitrary address.
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

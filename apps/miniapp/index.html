<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_temp.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Halo</title>
    <meta
      name="description"
      content="Halo rewards real humans for their everyday receipts. Snap your receipts, earn rewards, and prove you are a real human. Everyday spending becomes valuable."
    />
    <meta name="keywords" content="Halo, Mini Dapp, Human Labs" />

    <!--
      Link preview. Halo is shared person to person — a LINE friend invite, a
      message in a group chat — and a link with no preview reads as spam in
      exactly those places.

      No `og:url`: one bundle is served from three hosts (World, Celo, Kaia),
      so any URL written here would be wrong for two of them. Scrapers fall
      back to the URL they fetched, which is the correct one by construction.
      `og:image` has to be absolute, so it names one host on purpose — the
      asset is identical on all three.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Halo" />
    <meta property="og:title" content="Halo | Scan receipts, earn rewards" />
    <meta
      property="og:description"
      content="Halo rewards real humans for their everyday receipts. Snap your receipts, earn rewards, and prove you are a real human. Everyday spending becomes valuable."
    />
    <meta
      property="og:image"
      content="https://miniapp.halo.humanlabs.world/logo_temp.png"
    />
    <meta property="og:image:width" content="276" />
    <meta property="og:image:height" content="304" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
